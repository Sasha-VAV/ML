services:
  qdrant:
    image: qdrant/qdrant:latest      # pin to a real tag for anything you'll revisit
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots
    ulimits:
      nofile: 65535
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  qdrant_storage:
  qdrant_snapshots: