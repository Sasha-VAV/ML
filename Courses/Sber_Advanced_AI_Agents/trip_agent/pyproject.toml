[project]
name = "trip-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "gpt2giga>=0.3.0",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langfuse>=4.14.5",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
